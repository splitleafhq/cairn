name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: ./scripts/check.sh

  # Squash-merges a Dependabot PR once the jobs above pass, if the update is a
  # patch or minor. The steps live in splitleafhq/.github. Majors and anything
  # not Dependabot's stay open for a person. A new job goes in needs: too, or
  # this merges before it finishes.
  automerge:
    needs: [test]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: splitleafhq/.github/.github/workflows/dependabot-auto-merge.yml@df79f9cdda9b7d48e3c8f28d1c1f8c70c5397ff9 # main at #21
